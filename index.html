<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFlow - Control Financiero Personal</title>
    <!-- Configuración PWA -->
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" href="manifest.json">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: rgba(19, 26, 43, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-glow: rgba(59, 130, 246, 0.2);
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #131b2e 0%, #070a12 60%);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .dashboard-container {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px;
        }

        /* HEADER */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .app-title { 
            font-size: 1.3rem; font-weight: 800; 
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px; 
        }
        
        .header-actions { display: flex; gap: 6px; }

        /* GLASS CARDS */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); 
            padding: 16px; border-radius: 16px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }
        .card:hover { border-color: var(--card-border-glow); }

        .month-filter-card {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
        }
        .filter-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }

        /* CARDS KPI */
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .kpi-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 4px;
        }
        .kpi-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 500; }
        .kpi-amount { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
        .kpi-card.balance { 
            grid-column: span 2; 
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.3) 0%, rgba(17, 24, 39, 0.6) 100%);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .kpi-card.balance .kpi-amount { color: #60a5fa; font-size: 1.6rem; }
        .kpi-card.income .kpi-amount { color: var(--accent-green); }
        .kpi-card.expense .kpi-amount { color: var(--accent-red); }

        /* PRESUPUESTO */
        .budget-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; }
        .budget-bar-bg { width: 100%; height: 8px; background-color: rgba(255, 255, 255, 0.05); border-radius: 4px; overflow: hidden; }
        .budget-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #3b82f6); transition: width 0.4s, background 0.4s; }
        .budget-input-group { display: flex; gap: 8px; margin-top: 10px; }

        /* FORMULARIO Y CONTROLES */
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }

        .form-grid { display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-control {
            background-color: rgba(7, 10, 18, 0.6); border: 1px solid var(--card-border);
            color: var(--text-main); padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; width: 100%;
            transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-blue); }

        .btn-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; border: none;
            padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:active { opacity: 0.85; }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--card-border);
            padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.15); }

        /* HISTORIAL */
        .tx-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
        .tx-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background-color: rgba(7, 10, 18, 0.5); border-radius: 10px;
            border-left: 4px solid var(--text-sub); border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tx-item--ingreso { border-left: 4px solid var(--accent-green); }
        .tx-item--gasto { border-left: 4px solid var(--accent-red); }
        
        .tx-info { display: flex; flex-direction: column; gap: 2px; }
        .tx-desc { font-size: 0.85rem; font-weight: 700; }
        .tx-meta { font-size: 0.7rem; color: var(--text-sub); }
        
        .tx-actions { display: flex; align-items: center; gap: 8px; }
        .tx-amount { font-size: 0.85rem; font-weight: 700; }
        .tx-amount--income { color: var(--accent-green); }
        .tx-amount--expense { color: var(--accent-red); }
        
        .btn-icon {
            background: none; border: none; color: var(--text-sub);
            cursor: pointer; font-size: 0.85rem; padding: 2px 6px; border-radius: 6px;
        }
        .btn-icon.edit:hover { color: var(--accent-blue); background-color: rgba(59, 130, 246, 0.15); }
        .btn-icon.delete:hover { color: var(--accent-red); background-color: rgba(244, 63, 94, 0.15); }
        .tx-empty { font-size: 0.75rem; color: var(--text-sub); text-align: center; padding: 12px; }

        /* GRÁFICO */
        .chart-wrapper { 
            position: relative; width: 100%; height: 220px; 
            display: flex; justify-content: center; align-items: center;
        }
        .chart-empty-state {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background-color: rgba(7, 10, 18, 0.9); border-radius: 12px;
            color: var(--text-sub); font-size: 0.8rem; font-weight: 500;
            transition: opacity 0.3s ease; pointer-events: none; z-index: 10;
        }
        .chart-empty-state.hidden { opacity: 0; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- HEADER -->
        <header class="app-header">
            <div class="app-title">💳 FinFlow</div>
            <div class="header-actions">
                <button type="button" class="btn-secondary" id="btn-backup-export" title="Guardar respaldo JSON">💾 Backup</button>
                <button type="button" class="btn-secondary" id="btn-backup-import" title="Cargar respaldo JSON">📤 Cargar</button>
                <input type="file" id="file-input-json" accept=".json" style="display:none;">
            </div>
        </header>

        <!-- FILTRO DE PERIODO -->
        <div class="card month-filter-card">
            <span class="filter-label">📅 Periodo de Análisis:</span>
            <input type="month" id="filter-month" class="form-control" style="width: auto; padding: 6px 10px; font-size: 0.8rem;">
        </div>

        <!-- KPIs -->
        <div class="kpi-grid">
            <div class="kpi-card balance">
                <span class="kpi-title">Balance del Periodo</span>
                <span class="kpi-amount" id="disp-balance">$0</span>
            </div>
            <div class="kpi-card income">
                <span class="kpi-title">Ingresos</span>
                <span class="kpi-amount" id="disp-income">$0</span>
            </div>
            <div class="kpi-card expense">
                <span class="kpi-title">Gastos</span>
                <span class="kpi-amount" id="disp-expense">$0</span>
            </div>
        </div>

        <!-- PRESUPUESTO -->
        <div class="card">
            <div class="card-title" style="margin-bottom:8px;">🎯 Presupuesto Mensual</div>
            <div class="budget-header">
                <span id="budget-status-text">Gastado: $0 de $0</span>
                <span id="budget-percent-text">0%</span>
            </div>
            <div class="budget-bar-bg">
                <div class="budget-bar-fill" id="budget-bar"></div>
            </div>
            <div class="budget-input-group">
                <input type="number" id="budget-input" class="form-control" placeholder="Fijar meta ($ CLP)" style="padding: 6px 10px;">
                <button type="button" class="btn-secondary" id="btn-save-budget">Guardar Meta</button>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="card">
            <div class="card-header-flex">
                <div class="card-title" id="form-card-title">➕ Registrar Movimiento</div>
                <button type="button" class="btn-secondary" id="btn-cancel-edit" style="display:none;">Cancelar</button>
            </div>
            <form id="tx-form" class="form-grid">
                <input type="hidden" id="tx-edit-id" value="">
                <input type="text" id="tx-desc" class="form-control" placeholder="Concepto (ej: Arriendo, Sueldo...)" required>
                
                <div class="form-row">
                    <input type="number" id="tx-amount" class="form-control" placeholder="Monto ($)" required>
                    <select id="tx-type" class="form-control">
                        <option value="gasto">Gasto (-)</option>
                        <option value="ingreso">Ingreso (+)</option>
                    </select>
                </div>

                <div class="form-row">
                    <select id="tx-category" class="form-control">
                        <option value="Hogar">Hogar / Servicios</option>
                        <option value="Alimentación">Alimentación</option>
                        <option value="Ocio">Ocio / Salidas</option>
                        <option value="Sueldo">Sueldo / Trabajo</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <input type="date" id="tx-date" class="form-control" required>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit-tx">Guardar Transacción</button>
            </form>
        </div>

        <!-- GRÁFICO -->
        <div class="card">
            <div class="card-title">📊 Distribución de Gastos</div>
            <div class="chart-wrapper">
                <canvas id="category-chart"></canvas>
                <div class="chart-empty-state" id="chart-empty-msg">
                    <span>💸 Sin gastos registrados en este periodo</span>
                </div>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="card">
            <div class="card-header-flex">
                <div class="card-title">📜 Historial de Movimientos</div>
                <button type="button" class="btn-secondary" id="btn-export-csv">📥 Exportar CSV</button>
            </div>
            <div class="tx-list" id="tx-container">
                <p class="tx-empty">Aún no hay transacciones en este mes.</p>
            </div>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT COMPLETA -->
    <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'finflow_transactions';
      const BUDGET_KEY = 'finflow_monthly_budget';
      const VALID_TYPES = ['gasto', 'ingreso'];
      const VALID_CATEGORIES = ['Hogar', 'Alimentación', 'Ocio', 'Sueldo', 'Otros'];

      const currencyFormatter = new Intl.NumberFormat('es-CL', {
        style: 'currency', currency: 'CLP', maximumFractionDigits: 0
      });

      const dom = {
        filterMonth: document.getElementById('filter-month'),
        balance: document.getElementById('disp-balance'),
        income: document.getElementById('disp-income'),
        expense: document.getElementById('disp-expense'),
        form: document.getElementById('tx-form'),
        editId: document.getElementById('tx-edit-id'),
        desc: document.getElementById('tx-desc'),
        amount: document.getElementById('tx-amount'),
        type: document.getElementById('tx-type'),
        category: document.getElementById('tx-category'),
        date: document.getElementById('tx-date'),
        container: document.getElementById('tx-container'),
        formTitle: document.getElementById('form-card-title'),
        btnSubmit: document.getElementById('btn-submit-tx'),
        btnCancelEdit: document.getElementById('btn-cancel-edit'),
        budgetInput: document.getElementById('budget-input'),
        btnSaveBudget: document.getElementById('btn-save-budget'),
        budgetStatusText: document.getElementById('budget-status-text'),
        budgetPercentText: document.getElementById('budget-percent-text'),
        budgetBar: document.getElementById('budget-bar'),
        btnExportCsv: document.getElementById('btn-export-csv'),
        btnBackupExport: document.getElementById('btn-backup-export'),
        btnBackupImport: document.getElementById('btn-backup-import'),
        fileInputJson: document.getElementById('file-input-json')
      };

      let transactions = [];
      let monthlyBudget = 0;

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          transactions = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(transactions)) transactions = [];

          const rawBudget = localStorage.getItem(BUDGET_KEY);
          monthlyBudget = rawBudget ? parseFloat(rawBudget) : 0;
          dom.budgetInput.value = monthlyBudget > 0 ? monthlyBudget : '';
        } catch (err) {
          console.error('Error al leer localStorage:', err);
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      }

      function getFilteredTransactions() {
        const selectedMonth = dom.filterMonth.value;
        if (!selectedMonth) return transactions;
        return transactions.filter(t => t.date.startsWith(selectedMonth));
      }

      function exportJSONBackup() {
        if (transactions.length === 0) {
          alert("No hay datos para respaldar.");
          return;
        }
        const backupData = {
          version: '1.0',
          timestamp: new Date().toISOString(),
          monthlyBudget: monthlyBudget,
          transactions: transactions
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `FinFlow_Backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      }

      function importJSONBackup(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && Array.isArray(imported.transactions)) {
              transactions = imported.transactions;
              monthlyBudget = imported.monthlyBudget || 0;
              saveData();
              localStorage.setItem(BUDGET_KEY, monthlyBudget);
              dom.budgetInput.value = monthlyBudget > 0 ? monthlyBudget : '';
              render();
              alert("¡Copia de seguridad restaurada con éxito!");
            } else {
              alert("El archivo subido no tiene un formato válido de FinFlow.");
            }
          } catch (err) {
            alert("Error al leer el archivo JSON.");
          }
        };
        reader.readAsText(file);
      }

      function addOrUpdateTransaction(data) {
        if (data.id) {
          const idx = transactions.findIndex(t => String(t.id) === String(data.id));
          if (idx !== -1) {
            transactions[idx] = { ...transactions[idx], ...data, amount: Number(data.amount) };
          }
        } else {
          const tx = {
            id: (crypto.randomUUID ? crypto.randomUUID() : Date.now()),
            desc: data.desc.trim(),
            amount: Number(data.amount),
            type: data.type,
            category: data.category,
            date: data.date
          };
          transactions.push(tx);
        }
        saveData();
        resetForm();
        render();
      }

      function deleteTransaction(id) {
        transactions = transactions.filter((tx) => String(tx.id) !== String(id));
        saveData();
        render();
      }

      function startEditTransaction(id) {
        const tx = transactions.find(t => String(t.id) === String(id));
        if (!tx) return;

        dom.editId.value = tx.id;
        dom.desc.value = tx.desc;
        dom.amount.value = tx.amount;
        dom.type.value = tx.type;
        dom.category.value = tx.category;
        dom.date.value = tx.date;

        dom.formTitle.innerText = "✏️ Editar Movimiento";
        dom.btnSubmit.innerText = "Actualizar Transacción";
        dom.btnCancelEdit.style.display = "block";
        dom.desc.focus();
      }

      function resetForm() {
        dom.form.reset();
        dom.editId.value = "";
        dom.formTitle.innerText = "➕ Registrar Movimiento";
        dom.btnSubmit.innerText = "Guardar Transacción";
        dom.btnCancelEdit.style.display = "none";
        dom.date.value = new Date().toISOString().split('T')[0];
      }

      function calculateTotals() {
        let income = 0; let expense = 0;
        const currentList = getFilteredTransactions();
        currentList.forEach((tx) => {
          if (tx.type === 'ingreso') income += tx.amount;
          else if (tx.type === 'gasto') expense += tx.amount;
        });
        return { income, expense, balance: income - expense };
      }

      function getCategoryTotals() {
        const totals = {};
        VALID_CATEGORIES.forEach((cat) => { totals[cat] = 0; });
        const currentList = getFilteredTransactions();
        currentList.filter((tx) => tx.type === 'gasto').forEach((tx) => {
          totals[tx.category] = (totals[tx.category] || 0) + tx.amount;
        });
        return totals;
      }

      function renderBudget() {
        const { expense } = calculateTotals();
        if (monthlyBudget <= 0) {
          dom.budgetStatusText.innerText = `Gastado: ${currencyFormatter.format(expense)} (Sin meta fija)`;
          dom.budgetPercentText.innerText = "0%";
          dom.budgetBar.style.width = "0%";
          return;
        }

        const pct = Math.min(100, Math.round((expense / monthlyBudget) * 100));
        dom.budgetStatusText.innerText = `Gastado: ${currencyFormatter.format(expense)} de ${currencyFormatter.format(monthlyBudget)}`;
        dom.budgetPercentText.innerText = `${pct}%`;
        dom.budgetBar.style.width = `${pct}%`;

        if (pct >= 100) dom.budgetBar.style.background = "linear-gradient(90deg, #f43f5e, #e11d48)";
        else if (pct >= 80) dom.budgetBar.style.background = "linear-gradient(90deg, #f59e0b, #d97706)";
        else dom.budgetBar.style.background = "linear-gradient(90deg, #10b981, #3b82f6)";
      }

      function exportToCSV() {
        const currentList = getFilteredTransactions();
        if (currentList.length === 0) {
          alert("No hay transacciones en este periodo.");
          return;
        }
        let csv = "ID;Fecha;Concepto;Tipo;Categoria;Monto\n";
        currentList.forEach(t => {
          csv += `${t.id};${t.date};"${t.desc}";${t.type};${t.category};${t.amount}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `FinFlow_${dom.filterMonth.value || 'Export'}.csv`;
        link.click();
      }

      function renderKpis() {
        const { income, expense, balance } = calculateTotals();
        dom.balance.textContent = currencyFormatter.format(balance);
        dom.income.textContent = currencyFormatter.format(income);
        dom.expense.textContent = currencyFormatter.format(expense);
      }

      function renderTransactions() {
        dom.container.innerHTML = '';
        const currentList = getFilteredTransactions();
        
        if (currentList.length === 0) {
          dom.container.innerHTML = '<p class="tx-empty">Aún no hay transacciones en este mes.</p>';
          return;
        }

        const sorted = [...currentList].sort((a, b) => new Date(b.date) - new Date(a.date));
        const fragment = document.createDocumentFragment();

        sorted.forEach((tx) => {
          const item = document.createElement('div');
          item.className = `tx-item tx-item--${tx.type}`;
          const sign = tx.type === 'ingreso' ? '+' : '−';
          const amountClass = tx.type === 'ingreso' ? 'tx-amount--income' : 'tx-amount--expense';

          item.innerHTML = `
            <div class="tx-info">
              <span class="tx-desc">${escapeHtml(tx.desc)}</span>
              <span class="tx-meta">${escapeHtml(tx.category)} · ${escapeHtml(tx.date)}</span>
            </div>
            <div class="tx-actions">
              <span class="tx-amount ${amountClass}">${sign} ${currencyFormatter.format(tx.amount)}</span>
              <button type="button" class="btn-icon edit" data-id="${tx.id}" title="Editar">✏️</button>
              <button type="button" class="btn-icon delete" data-id="${tx.id}" title="Eliminar">✕</button>
            </div>
          `;
          fragment.appendChild(item);
        });
        dom.container.appendChild(fragment);
      }

      function render() {
        renderKpis();
        renderBudget();
        renderTransactions();
        if (window.updateFinFlowChart) window.updateFinFlowChart();
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function handleSubmit(e) {
        e.preventDefault();
        addOrUpdateTransaction({
          id: dom.editId.value,
          desc: dom.desc.value,
          amount: parseFloat(dom.amount.value),
          type: dom.type.value,
          category: dom.category.value,
          date: dom.date.value
        });
      }

      function handleContainerClick(e) {
        const editBtn = e.target.closest('.edit');
        const deleteBtn = e.target.closest('.delete');

        if (editBtn) startEditTransaction(editBtn.dataset.id);
        if (deleteBtn) deleteTransaction(deleteBtn.dataset.id);
      }

      function init() {
        loadData();
        
        const now = new Date();
        const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        dom.filterMonth.value = yearMonth;
        dom.date.value = now.toISOString().split('T')[0];

        render();

        dom.filterMonth.addEventListener('change', render);
        dom.form.addEventListener('submit', handleSubmit);
        dom.container.addEventListener('click', handleContainerClick);
        dom.btnCancelEdit.addEventListener('click', resetForm);
        dom.btnExportCsv.addEventListener('click', exportToCSV);

        dom.btnBackupExport.addEventListener('click', exportJSONBackup);
        dom.btnBackupImport.addEventListener('click', () => dom.fileInputJson.click());
        dom.fileInputJson.addEventListener('change', importJSONBackup);

        dom.btnSaveBudget.addEventListener('click', () => {
          const val = parseFloat(dom.budgetInput.value);
          monthlyBudget = isNaN(val) || val < 0 ? 0 : val;
          localStorage.setItem(BUDGET_KEY, monthlyBudget);
          renderBudget();
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(err => console.log('SW no registrado', err));
        }
      }

      document.addEventListener('DOMContentLoaded', init);
      window.getCategoryTotals = getCategoryTotals;
    })();
    </script>

    <!-- JS CHART.JS -->
    <script>
        let categoryChart = null;

        function initChart() {
            const ctx = document.getElementById('category-chart').getContext('2d');
            categoryChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Hogar', 'Alimentación', 'Ocio', 'Sueldo', 'Otros'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#64748b'],
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { size: 11 }, padding: 12, usePointStyle: true, pointStyle: 'circle' }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const val = context.raw || 0;
                                    return ' ' + new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val);
                                }
                            }
                        }
                    },
                    cutout: '72%'
                }
            });
        }

        window.updateFinFlowChart = function() {
            if (!categoryChart) return;
            const totals = window.getCategoryTotals();
            const categories = ['Hogar', 'Alimentación', 'Ocio', 'Sueldo', 'Otros'];
            const values = categories.map(cat => totals[cat] || 0);

            const totalExpenses = values.reduce((acc, curr) => acc + curr, 0);
            const emptyMsg = document.getElementById('chart-empty-msg');

            if (emptyMsg) {
                if (totalExpenses === 0) emptyMsg.classList.remove('hidden');
                else emptyMsg.classList.add('hidden');
            }

            categoryChart.data.datasets[0].data = values;
            categoryChart.update();
        };

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            window.updateFinFlowChart();
        });
    </script>
</body>
</html>
